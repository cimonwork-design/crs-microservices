services:
  mysql-auth:
    image: mysql:8.0
    container_name: crs-mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - crs-mysql-auth-data:/var/lib/mysql

  mysql-course:
    image: mysql:8.0
    container_name: crs-mysql-course
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course_db
    ports:
      - "3308:3306"
    volumes:
      - crs-mysql-course-data:/var/lib/mysql

  mysql-registration:
    image: mysql:8.0
    container_name: crs-mysql-registration
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: registration_db
    ports:
      - "3309:3306"
    volumes:
      - crs-mysql-registration-data:/var/lib/mysql

  auth-service:
    build: ./auth-service
    container_name: crs-auth-service
    depends_on:
      - mysql-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8081:8081"

  course-service:
    build: ./course-service
    container_name: crs-course-service
    depends_on:
      - mysql-course
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-course:3306/course_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8082:8082"

  registration-service:
    build: ./registration-service
    container_name: crs-registration-service
    depends_on:
      - mysql-registration
      - course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-registration:3306/registration_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
      COURSE_SERVICE_BASE_URL: http://course-service:8082
    ports:
      - "8083:8083"

  api-gateway:
    build: ./api-gateway
    container_name: crs-api-gateway
    depends_on:
      - auth-service
      - course-service
      - registration-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      REGISTRATION_SERVICE_URL: http://registration-service:8083
    ports:
      - "8080:8080"

volumes:
  crs-mysql-auth-data:
  crs-mysql-course-data:
  crs-mysql-registration-data:
